name: Build apps
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Retro-Netplay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Retro-Netplay.apk

  linux:
    # built on an older Ubuntu so the download runs on older Linux systems too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools (and GStreamer + Python GObject for the player window, which carries its own copy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick xdotool zip libfuse2 python3-gi python3-venv \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pulseaudio gstreamer1.0-alsa >/dev/null
      - name: Build zip and AppImage
        run: PLAYER_PYTHON=/usr/bin/python3 sh desktop/packaging/build-linux.sh
      - name: Open the app on a virtual screen and take screenshots
        run: sh desktop/packaging/smoke-test.sh dist/Retro-Netplay-x86_64.AppImage shots
      - name: The packaged player, end to end against the real host over TCP (also through a relay)
        # CI has no graphics card, so only for this test the ready-made player borrows the system's software decoder
        # (the download itself carries none: see build-player.sh)
        run: |
          sudo apt-get install -y -qq gstreamer1.0-plugins-ugly gstreamer1.0-libav coturn >/dev/null
          mkdir -p pk && (cd pk && unzip -q ../dist/Retro-Netplay-linux-x86_64.zip)
          P="$PWD/pk/Retro-Netplay/_internal"
          "$P/player/Retro-Netplay-Player" --check || true
          echo "== the ready-made player"
          NETPLAY_PLAYER="$P/player/Retro-Netplay-Player" GST_PLUGIN_PATH_1_0="$P/player/_internal/gst_plugins:/usr/lib/x86_64-linux-gnu/gstreamer-1.0" \
            /usr/bin/python3 desktop/tests/test_native_guest.py
          echo "== the fallback: the player script with the computer's own Python and GStreamer"
          NETPLAY_PLAYER="/usr/bin/python3 $P/hostpy/stream_guest.py" /usr/bin/python3 desktop/tests/test_native_guest.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-shots
          path: shots/*

  stream:
    # the real stream host (GStreamer WebRTC) streaming to the native player and to the Android app's page in Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GStreamer, Python GObject, Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice gstreamer1.0-libav coturn python3-tk >/dev/null
          /usr/bin/python3 -m pip install --break-system-packages -q playwright pysdl2==0.9.17 pysdl2-dll==2.30.2
          /usr/bin/python3 -m playwright install --with-deps chromium >/dev/null
          sudo modprobe uinput && sudo chmod 666 /dev/uinput
      - name: Stream setup over TCP, the player's logic, the app's join flow, the Android app's path
        run: |
          for t in test_tcp_signal test_stream_guest test_app_own test_android_stream test_two_devices; do
            echo "== $t"; /usr/bin/python3 desktop/tests/$t.py || exit 1
          done
      - name: Native player window (headless) against the real stream host over TCP, also through a relay
        run: /usr/bin/python3 desktop/tests/test_native_guest.py
      - name: Real stream to the Android app's web page (deprecated path), end to end
        run: /usr/bin/python3 desktop/tests/test_real_host.py

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [android, linux, stream]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/android/Retro-Netplay.apk out/linux/Retro-Netplay-linux-x86_64.zip out/linux/Retro-Netplay-x86_64.AppImage \
            --title "Retro-Netplay test build" \
            --notes "Early test build, from commit ${GITHUB_SHA::7}.

          - Android: Retro-Netplay.apk (install on your phone; debug-signed).
          - Linux: Retro-Netplay-x86_64.AppImage (one file: download, then double-click; if it won't open, right-click > Properties > Permissions > Allow executing as program), or Retro-Netplay-linux-x86_64.zip (unzip, open the folder, double-click Retro-Netplay).

          No games, BIOS or firmware are included. Licence GPL-3.0."
      - name: Screenshots from the automatic test (separate test release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-screens --yes --cleanup-tag || true
          gh release create ci-screens out/linux-shots/* --prerelease --latest=false --title "Automatic test screenshots" --notes "Not a download. Screenshots of the desktop app from the automatic build."
