plugins { id 'com.android.application' }

android {
    namespace 'net.netplay.app'
    compileSdk 34
    defaultConfig {
        applicationId "net.netplay.matchmaker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // (automatic tests: plays a real stream in an emulator, see androidTest/PlayerCheck.java)
        testInstrumentationRunner "net.netplay.app.PlayerCheck"
        // the app's ScreenScraper developer ID for the optional art download, from the project's CI secrets
        // (SS_DEVID, SS_DEVPASSWORD); empty in other builds, and then the app says the download isn't available
        def q = { String v -> '"' + (v ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"' }
        buildConfigField "String", "SS_DEVID", q(System.getenv('SS_DEVID'))
        buildConfigField "String", "SS_DEVPASSWORD", q(System.getenv('SS_DEVPASSWORD'))
    }
    buildFeatures { buildConfig true }
    // CI runs lintDebug for one thing only: calls that need a newer Android than minSdk (they'd crash on older phones)
    lint {
        checkOnly 'NewApi'
        checkDependencies true
        abortOnError true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    // WebRTC for the stream player (Apache 2.0; Google's libwebrtc inside is BSD). Plays VP8 itself; H.264 only
    // through the phone's own video decoder (MediaCodec), so nothing patented ships in the app.
    implementation 'io.getstream:stream-webrtc-android:1.2.2'
}
