name: Build apps
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        env:   # the app's ScreenScraper developer ID for the art download, only if this project has one
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: gradle -p android assembleDebug lintDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Retro-Netplay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Retro-Netplay.apk

  linux:
    # built on an older Ubuntu so the download runs on older Linux systems too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: ScreenScraper developer ID for the art download (only if this project has one in its secrets)
        shell: bash
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: |
          [ -n "$SS_DEVID" ] || { echo "no ScreenScraper developer ID: this build can't download art (Skraper's files still work)"; exit 0; }
          printf 'DEVID = "%s"\nDEVPASSWORD = "%s"\n' "$SS_DEVID" "$SS_DEVPASSWORD" > desktop/ss_dev.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools (and GStreamer + Python GObject for the player window, which carries its own copy)
        timeout-minutes: 20      # (a stalled package install fails here, with its log, instead of hanging)
        run: |
          bash .github/apt-install.sh xvfb imagemagick xdotool zip libfuse2 python3-gi python3-venv \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pulseaudio gstreamer1.0-alsa
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build zip and AppImage
        run: PLAYER_PYTHON=/usr/bin/python3 sh desktop/packaging/build-linux.sh
      - name: Open the app on a virtual screen and take screenshots
        run: sh desktop/packaging/smoke-test.sh dist/Retro-Netplay-x86_64.AppImage shots
      - name: The packaged player, end to end against the real host over TCP (also through a relay)
        timeout-minutes: 20      # (a stalled package install fails here, with its log, instead of hanging)
        # CI has no graphics card, so only for this test the ready-made player borrows the system's software decoder
        # (the download itself carries none: see build-player.sh)
        run: |
          bash .github/apt-install.sh gstreamer1.0-plugins-ugly gstreamer1.0-libav coturn
          mkdir -p pk && (cd pk && unzip -q ../dist/Retro-Netplay-linux-x86_64.zip)
          P="$PWD/pk/Retro-Netplay/resources/engine/_internal"
          "$P/player/Retro-Netplay-Player" --check || true
          echo "== the ready-made player"
          mkdir -p sysdec && ln -sf /usr/lib/x86_64-linux-gnu/gstreamer-1.0/libgstlibav.so sysdec/
          printf '#!/bin/sh\nGST_PLUGIN_PATH_1_0="%s" exec "%s" "$@"\n' "$P/player/_internal/gst_plugins:$PWD/sysdec" \
            "$P/player/Retro-Netplay-Player" > player.sh && chmod +x player.sh     # (only the player gets only the decoder)
          NETPLAY_PLAYER="$PWD/player.sh" /usr/bin/python3 desktop/tests/test_native_guest.py
          echo "== the fallback: the player script with the computer's own Python and GStreamer"
          NETPLAY_PLAYER="/usr/bin/python3 $P/hostpy/stream_guest.py" /usr/bin/python3 desktop/tests/test_native_guest.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-shots
          path: shots/*

  stream:
    # the real stream host (GStreamer WebRTC) streaming to the native player, and every other test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GStreamer, Python GObject, SDL
        timeout-minutes: 20      # (a stalled package install fails here, with its log, instead of hanging)
        run: |
          bash .github/apt-install.sh python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice gstreamer1.0-libav coturn python3-tk python3-pil
          /usr/bin/python3 -m pip install --break-system-packages -q pysdl2==0.9.17 pysdl2-dll==2.30.2
          sudo modprobe uinput && sudo chmod 666 /dev/uinput
      - name: All the other tests (matchmaker, friends, queue, stream setup, the player's logic, the Android core)
        run: |
          for t in test_tcp_signal test_stream_guest test_app_own test_android_stream test_two_devices test_desktop_queue \
                   test_friends test_friends_java test_library test_lobby test_engine test_arcade_java test_memguard test_gameinfo test_titlecard test_screenscraper test_portal test_portmap test_portmap_java test_autofind \
                   test_stream_host test_tls test_android_player_core; do
            echo "== $t"; /usr/bin/python3 desktop/tests/$t.py || exit 1
          done
      - name: Native player window (headless) against the real stream host over TCP, also through a relay
        run: /usr/bin/python3 desktop/tests/test_native_guest.py
      - name: The real RetroArch, started by the app, in one netplay session (on a virtual screen)
        timeout-minutes: 20      # (a stalled package install fails here, with its log, instead of hanging)
        run: |
          bash .github/apt-install.sh retroarch libretro-mgba xvfb gstreamer1.0-x
          /usr/bin/python3 desktop/tests/test_real_retroarch.py | tee real.txt
          grep -q "ALL PASSED" real.txt      # (it must really run here, not skip)
      - name: A stream room for real (one host for three players; then through the app on a virtual screen)
        run: |
          /usr/bin/python3 desktop/tests/test_stream_room.py | tee room.txt
          grep -q "ALL PASSED" room.txt

  android-player:
    # the phone app's own player (libwebrtc + Android's video decoder) in an Android emulator, against the real
    # stream host running on this machine (the emulator reaches it at 10.0.2.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: GStreamer for the stream host
        timeout-minutes: 20      # (a stalled package install fails here, with its log, instead of hanging)
        run: |
          bash .github/apt-install.sh python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice gstreamer1.0-tools
      - name: Build the app and its player test
        env:   # the app's ScreenScraper developer ID for the art download, only if this project has one
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: gradle -p android assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Let the emulator use the processor's virtualisation (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The player in an emulator, end to end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r -t android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            /usr/bin/python3 desktop/tests/test_android_player.py
            /usr/bin/python3 desktop/tests/test_android_card.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-card-screens
          path: android-card/
          if-no-files-found: ignore

  windows:
    # the Windows download: the app plus the player window with its own GStreamer (from MSYS2) and SDL.
    # Released as an early test build: it hasn't been tried on a real Windows PC yet (see README.txt).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: ScreenScraper developer ID for the art download (only if this project has one in its secrets)
        shell: bash
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: |
          [ -n "$SS_DEVID" ] || { echo "no ScreenScraper developer ID: this build can't download art (Skraper's files still work)"; exit 0; }
          printf 'DEVID = "%s"\nDEVPASSWORD = "%s"\n' "$SS_DEVID" "$SS_DEVPASSWORD" > desktop/ss_dev.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            python:p python-gobject:p python-pip:p pyinstaller:p gstreamer:p gst-plugins-base:p gst-plugins-good:p
            gst-plugins-bad:p libnice:p SDL2:p SDL2_ttf:p
      - name: Build the player window (own GStreamer + SDL, no software H.264 decoder)
        shell: msys2 {0}
        run: PLAYER_PYTHON=python3 sh desktop/packaging/build-player.sh player-out
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the app (the engine with the player inside, in its window)
        shell: bash
        run: |
          python -m pip install --quiet pyinstaller==6.11.1
          python desktop/packaging/pack_app.py --player player-out
      - name: The player starts and finds its own GStreamer
        shell: pwsh
        run: |
          $P = "desktop/shell/dist/win-unpacked/resources/engine/_internal/player"
          $out = & "$P/Retro-Netplay-Player.exe" --check 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "\[OK\] webrtcbin" -or $out -notmatch "\[OK\] window and controllers") { exit 1 }
          $lic = (Get-ChildItem "$P/licenses").Count
          Write-Output "licence files in the player: $lic"
          if ($lic -lt 10) { exit 1 }
          exit 0     # (no graphics-card decoder on GitHub's Windows machines, so --check itself says [X] for that)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Retro-Netplay-windows-x86_64.zip

  mac:
    # the Mac download (Apple Silicon): the app, netplay:// links, and the player window with Homebrew's GStreamer
    # (video decoded by macOS's own VideoToolbox). Released as an early test build: not yet tried on a real Mac.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: ScreenScraper developer ID for the art download (only if this project has one in its secrets)
        shell: bash
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: |
          [ -n "$SS_DEVID" ] || { echo "no ScreenScraper developer ID: this build can't download art (Skraper's files still work)"; exit 0; }
          printf 'DEVID = "%s"\nDEVPASSWORD = "%s"\n' "$SS_DEVID" "$SS_DEVPASSWORD" > desktop/ss_dev.py
      - name: GStreamer with its WebRTC network plugin and PyGObject (Homebrew) for the player; coturn for the relay test
        run: brew install gstreamer libnice-gstreamer pygobject3 coturn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the app with the player inside
        run: APP_PYTHON=python3 PLAYER_PYTHON="$(brew --prefix)/bin/python3" sh desktop/packaging/build-mac.sh
      - name: The packaged player starts, links are registered, licences are inside
        run: |
          mkdir -p pk && ditto -x -k dist/Retro-Netplay-mac-arm64.zip pk
          A=pk/Retro-Netplay.app
          codesign --verify --deep --strict "$A"
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$A/Contents/Info.plist" | grep -qx netplay
          out="$(NETPLAY_DEBUG=1 NETPLAY_TRACE_AFTER=60 GST_DEBUG=2 "$A/Contents/Resources/engine/_internal/player/Retro-Netplay-Player" --check 2>&1 || true)"; echo "$out"
          for want in "\[OK\] webrtcbin" "\[OK\] window and controllers" "video decoder: vtdec"; do
            echo "$out" | grep -q "$want" || { echo "missing: $want"; exit 1; }
          done
          n="$(ls "$A/Contents/Resources/engine/_internal/player/licenses" | wc -l)"; echo "licence files in the player: $n"; [ "$n" -ge 10 ]
      - name: The packaged player, end to end against the real host (this Mac's Homebrew GStreamer hosts)
        # (frame rate: this small virtual Mac also runs the host, its software encoder and the relay, so expect 20, not 60)
        run: NETPLAY_MIN_FPS=20 NETPLAY_PLAYER="$PWD/pk/Retro-Netplay.app/Contents/Resources/engine/_internal/player/Retro-Netplay-Player" "$(brew --prefix)/bin/python3" desktop/tests/test_native_guest.py
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/Retro-Netplay-mac-arm64.zip

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [android, android-player, linux, mac, stream, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/android/Retro-Netplay.apk out/linux/Retro-Netplay-linux-x86_64.zip out/linux/Retro-Netplay-x86_64.AppImage \
            out/windows/Retro-Netplay-windows-x86_64.zip out/mac/Retro-Netplay-mac-arm64.zip \
            --title "Retro-Netplay test build" \
            --notes "Early test build, from commit ${GITHUB_SHA::7}.

          Version 2, the arcade: open a room for the game you're playing and people in the lobby ask to join, or jump into someone else's room. Netplay rooms (RetroArch, Dolphin) for games whose emulator has its own netplay, stream rooms (like Parsec Arcade) for everything else. Lobby and room chat with a swear-word filter, block and report; whoever runs a lobby can mute, remove and ban. Any app can run a lobby: share it from Settings > Lobby. For people 13 and over. All devices need this version (older apps can't use the new lobbies). README.txt explains it step by step.

          - Linux: Retro-Netplay-x86_64.AppImage (one file: download, then double-click; if it won't open, right-click > Properties > Permissions > Allow executing as program), or Retro-Netplay-linux-x86_64.zip (unzip, open the folder, double-click retro-netplay). Hosting stream rooms works on Linux.
          - Windows (EARLY TEST, never tried on a real Windows PC yet): Retro-Netplay-windows-x86_64.zip, unzip and double-click Retro-Netplay. Joins rooms; hosting netplay rooms should work but hasn't been tested, and hosting stream rooms comes later.
          - Mac (EARLY TEST, Apple Silicon, never tried on a real Mac yet): Retro-Netplay-mac-arm64.zip, unzip, move Retro-Netplay to Applications and open it. It isn't signed by Apple, so the first time: System Settings > Privacy & Security > Open Anyway. Joins rooms.
          - Android: Retro-Netplay.apk (debug-signed). Joins rooms (stream rooms in the app's player; RetroArch rooms in RetroArch). Hosting from a phone comes later.

          No games, BIOS or firmware are included. Licence GPL-3.0."
      - name: Screenshots from the automatic test (separate test release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-screens --yes --cleanup-tag || true
          gh release create ci-screens out/linux-shots/* --prerelease --latest=false --title "Automatic test screenshots" --notes "Not a download. Screenshots of the desktop app from the automatic build."
