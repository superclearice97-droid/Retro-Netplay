<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; color: #e8e8e8; font: 14px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  iframe { flex: 1 1 55%; border: 0; width: 100%; min-height: 200px; background: #000; }
  #host { flex: 0 0 auto; padding: 8px 10px; border-top: 2px solid #2d7ff9; max-height: 45%; overflow: auto; }
  h1 { font-size: 13px; margin: 0 0 4px; color: #8ab4ff; font-weight: 600; }
  canvas { width: 160px; height: 90px; float: right; margin: 0 0 4px 8px; border: 1px solid #333; }
  .chip { display: inline-block; min-width: 26px; text-align: center; padding: 2px 6px; margin: 1px; border-radius: 6px; background: #222; color: #666; }
  .chip.on { background: #2d7ff9; color: #fff; }
  pre { margin: 4px 0 0; white-space: pre-wrap; font: 12px ui-monospace, monospace; color: #aaa; }
</style>
</head>
<body>
<div id="wrap">
  <iframe id="guest" allow="gamepad; autoplay"></iframe>
  <div id="host">
    <canvas id="cv" width="640" height="360"></canvas>
    <h1 id="title">Host (simulated)</h1>
    <div id="chips"></div>
    <div id="sticks"></div>
    <pre id="log"></pre>
  </div>
</div>
<script>
"use strict";
// A stand-in for the real host, running in this browser tab. It "streams" an animated picture that also
// draws whatever the guest is pressing, so you can see a button go guest -> host -> back as video.
const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const NAMES = ["A","B","X","Y","LB","RB","LT","RT","Back","Start","L3","R3","Up","Down","Left","Right","Home"];
const state = { buttons: 0, ax: [0,0,0,0], lt: 0, rt: 0, packets: 0, rtt: "?", last: null, stats: null };
let logLines = [];
const log = (t) => { logLines.push(new Date().toLocaleTimeString() + " " + t); logLines = logLines.slice(-6); $("log").textContent = logLines.join("\n"); };

NAMES.forEach((n) => { const c = document.createElement("span"); c.className = "chip"; c.textContent = n; $("chips").appendChild(c); });
function paintChips() {
  [...$("chips").children].forEach((c, i) => c.classList.toggle("on", !!(state.buttons & (1 << i)) || (i === 6 && state.lt > 40) || (i === 7 && state.rt > 40)));
  $("sticks").textContent = "left stick " + state.ax.slice(0, 2).map((v) => (v / 32767).toFixed(2)).join(", ") +
    "   right stick " + state.ax.slice(2).map((v) => (v / 32767).toFixed(2)).join(", ") + "   packets " + state.packets;
}

async function main() {
  let hostKey = params.get("k");
  if (!hostKey) {
    const r = await fetch("/demo/new");
    if (!r.ok) return log("The server isn't in demo mode. Start it with:  python3 server.py --demo");
    const keys = await r.json();
    hostKey = keys.host;
    $("guest").src = "/play?t=" + encodeURIComponent(keys.guest);
    log("Made a test session. The top half is the guest; this half is the host.");
  } else {
    $("guest").remove();
    $("host").style.maxHeight = "none";
    $("title").textContent = "Host (simulated) for your real match";
    log("Waiting for the other player to open their stream link...");
  }

  const cfg = await (await fetch("/cfg?t=" + hostKey)).json();
  const pc = new RTCPeerConnection({ iceServers: cfg.iceServers });
  const cv = $("cv"), g = cv.getContext("2d");
  let n = 0, x = 0;
  setInterval(() => {
    n++; x = (x + 6) % 600;
    g.fillStyle = "#14213d"; g.fillRect(0, 0, 640, 360);
    g.fillStyle = "#fca311"; g.fillRect(x, 300, 40, 40);
    g.fillStyle = "#fff"; g.font = "28px sans-serif"; g.fillText("frame " + n, 20, 40);
    g.font = "34px sans-serif"; g.fillStyle = "#8ecae6";
    const pressed = NAMES.filter((_, i) => (state.buttons & (1 << i)) || (i === 6 && state.lt > 40) || (i === 7 && state.rt > 40));
    g.fillText(pressed.length ? "Player 2: " + pressed.join(" + ") : "Player 2: (nothing pressed)", 20, 150);
    g.font = "20px sans-serif"; g.fillStyle = "#bbb";
    g.fillText("stick " + state.ax.slice(0, 2).map((v) => (v / 32767).toFixed(1)).join(", "), 20, 200);
  }, 16);
  const stream = cv.captureStream(60);
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  const pad = pc.createDataChannel("pad", { ordered: false, maxRetransmits: 0 });
  const ctl = pc.createDataChannel("ctl");
  pad.binaryType = "arraybuffer";
  pad.onmessage = (e) => {
    const d = new DataView(e.data);
    if (d.byteLength !== 16 || d.getUint8(0) !== 1) return;
    state.buttons = d.getUint32(2, true);
    state.ax = [6, 8, 10, 12].map((o) => d.getInt16(o, true));
    state.lt = d.getUint8(14); state.rt = d.getUint8(15); state.packets++;
    paintChips();
  };
  ctl.onopen = () => { ctl.send(JSON.stringify({ t: "slot", n: 2 })); log("Guest connected."); };
  ctl.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "ping") ctl.send(JSON.stringify({ t: "pong", ts: m.ts }));
    if (m.t === "stats") { state.stats = m.s; }
  };
  setInterval(() => {
    const s = state.stats; if (!s) return;
    log(`guest sees: round trip ${s.rttMs} ms, jitter buffer ${s.jitterBufMs} ms, decode ${s.decodeMs} ms, ${s.fps} fps, lost ${s.lost}`);
  }, 4000);
  const post = (m) => fetch("/sig?t=" + hostKey, { method: "POST", body: JSON.stringify(m) });
  pc.onicecandidate = (e) => { if (e.candidate) post({ type: "ice", candidate: e.candidate.candidate, sdpMLineIndex: e.candidate.sdpMLineIndex }); };
  pc.onconnectionstatechange = () => log("connection: " + pc.connectionState);
  paintChips();
  for (;;) {
    const r = await fetch("/sig?t=" + hostKey + "&wait=20");
    if (r.status === 404) return log("Session ended.");
    for (const m of (await r.json()).msgs) {
      if (m.type === "hello") { await pc.setLocalDescription(await pc.createOffer()); await post({ type: "offer", sdp: pc.localDescription.sdp }); }
      else if (m.type === "answer") await pc.setRemoteDescription({ type: "answer", sdp: m.sdp });
      else if (m.type === "ice") await pc.addIceCandidate({ candidate: m.candidate, sdpMLineIndex: m.sdpMLineIndex }).catch(() => {});
    }
  }
}
main().catch((e) => log("Error: " + e));
</script>
</body>
</html>
