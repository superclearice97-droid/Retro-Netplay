name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NetplayMatchmaker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Retro-Netplay.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Retro-Netplay.apk --title "Retro-Netplay test build" --notes "Early test build (debug-signed). Install on Android and open it. Built from commit ${GITHUB_SHA::7}." --prerelease
