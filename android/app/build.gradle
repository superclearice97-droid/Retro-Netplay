plugins { id 'com.android.application' }

android {
    namespace 'net.netplay.app'
    compileSdk 34
    defaultConfig {
        applicationId "net.netplay.matchmaker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
